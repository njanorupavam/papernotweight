  <rect x="955" y="345" width="180" height="55" rx="8" fill="#0d1814" stroke="#253f33" stroke-width="1"/>
  <text x="965" y="370" fill="#e2ede5" font-size="12" font-weight="600">🗺️ Privacy Hotspot Map</text>
  <text x="965" y="388" fill="#7d9187" font-size="10">Aggregated cluster cells</text>

  <rect x="955" y="415" width="180" height="55" rx="8" fill="#0d1814" stroke="#253f33" stroke-width="1"/>
  <text x="965" y="440" fill="#e2ede5" font-size="12" font-weight="600">🏆 Hunter Leaderboard</text>
  <text x="965" y="458" fill="#7d9187" font-size="10">Ranks, streaks, badges</text>

  <rect x="955" y="485" width="180" height="55" rx="8" fill="#0d1814" stroke="#253f33" stroke-width="1"/>
  <text x="965" y="510" fill="#e2ede5" font-size="12" font-weight="600">📊 Field Dashboard</text>
