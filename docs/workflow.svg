  <text x="600" y="60" text-anchor="middle" fill="#1ee29a" font-size="12" font-weight="700" letter-spacing="4" font-family="monospace">MOSQUITONET ARCHITECTURE &amp; DATA PIPELINE</text>
  <text x="600" y="95" text-anchor="middle" fill="#f0f7f2" font-size="24" font-weight="800">Autonomous Bio-Acoustic Defense Grid</text>

  <!-- Node 1: Sensor & Input Layer -->
  <rect x="50" y="140" width="240" height="420" rx="12" fill="url(#cardGrad)" stroke="#22392e" stroke-width="1.5"/>
  <rect x="50" y="140" width="240" height="45" rx="12" fill="#15261f"/>
  <text x="170" y="168" text-anchor="middle" fill="#1ee29a" font-size="14" font-weight="700">1. Intake &amp; Sensor Layer</text>
  
  <rect x="70" y="205" width="200" height="65" rx="8" fill="#0d1814" stroke="#253f33" stroke-width="1"/>
  <text x="85" y="230" fill="#e2ede5" font-size="13" font-weight="600">🎙️ Bio-Acoustic Feed</text>
  <text x="85" y="252" fill="#7d9187" font-size="11">Real-time wingbeat audio (480-620Hz)</text>

  <rect x="70" y="285" width="200" height="65" rx="8" fill="#0d1814" stroke="#253f33" stroke-width="1"/>
  <text x="85" y="310" fill="#e2ede5" font-size="13" font-weight="600">📷 Room Image Scanner</text>
  <text x="85" y="332" fill="#7d9187" font-size="11">Deterministic SHA-256 byte hashing</text>

  <rect x="70" y="365" width="200" height="65" rx="8" fill="#0d1814" stroke="#253f33" stroke-width="1"/>
  <text x="85" y="390" fill="#e2ede5" font-size="13" font-weight="600">⚡ Community Kill Reports</text>
  <text x="85" y="412" fill="#7d9187" font-size="11">Electric bat &amp; racket strikes</text>

  <rect x="70" y="445" width="200" height="65" rx="8" fill="#0d1814" stroke="#253f33" stroke-width="1"/>
  <text x="85" y="470" fill="#e2ede5" font-size="13" font-weight="600">📍 GeoJSON District Nodes</text>
