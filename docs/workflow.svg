  <!-- Arrows 1 -> 2 -->
  <path d="M 290 350 L 340 350" stroke="#1ee29a" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="340,350 332,345 332,355" fill="#1ee29a"/>

